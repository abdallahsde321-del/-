
name: Run 6-Hour Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '50 */5 * * *'

concurrency:
  group: youtube-stream-group
  cancel-in-progress: true

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Streamlink
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install streamlink

      - name: Verify FFmpeg H.264 encoder
        run: |
          ffmpeg -hide_banner -encoders 2>/dev/null | grep libx264

      - name: Run Main Script
        env:
          TIKTOK_URL: ${{ secrets.TIKTOK_URL }}
        run: python -u main.py
