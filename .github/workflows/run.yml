name: Run 6-Hour Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '50 */5 * * *'

concurrency:
  group: youtube-stream-group
  cancel-in-progress: true

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Streamlink
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir streamlink

          ffmpeg -version
          streamlink --version

      - name: Verify FFmpeg H.264 encoder
        run: |
          set -eu
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          echo "FFmpeg H.264 encoder is available."

      - name: Run Main Script
        run: python -u main.py
