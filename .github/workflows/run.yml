name: Run 6-Hour Stream via Docker

on:
  workflow_dispatch:
  schedule:
    - cron: '50 */5 * * *'

concurrency:
  group: youtube-stream-group
  cancel-in-progress: true

jobs:
  run-docker-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t tiktok-to-youtube .

      - name: Run Docker Container
        run: docker run --rm tiktok-to-youtube
